services:
  backend:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["lyftr_data:/data"]
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  lyftr_data:
